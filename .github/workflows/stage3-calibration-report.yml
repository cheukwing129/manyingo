name: Stage 3 Calibration Report

on:
  workflow_dispatch:
    inputs:
      min_events:
        description: "Minimum calibration events before a mapping can be classified"
        required: true
        default: "20"
        type: string
      min_learners:
        description: "Minimum distinct learners before a mapping can be classified"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: manjingo-95d9a
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANJINGO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Firebase ADC credential
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_MANJINGO GitHub Actions secret."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase Admin runtime
        run: npm install --prefix functions --no-audit --no-fund

      - name: Run repository tests
        run: npm test

      - name: Generate anonymous calibration report
        run: >-
          node scripts/report_stage3_calibration.cjs
          --min-events "${{ inputs.min_events }}"
          --min-learners "${{ inputs.min_learners }}"
          --json artifacts/stage3-calibration-report.json
          --markdown artifacts/stage3-calibration-report.md

      - name: Upload calibration report
        uses: actions/upload-artifact@v4
        with:
          name: stage3-calibration-report
          path: artifacts/stage3-calibration-report.*
          if-no-files-found: error
          retention-days: 30
