name: Pages Production Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  workflow_run:
    workflows: ['Firebase Content Sync']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: >-
      vars.ENABLE_PAGES_SMOKE == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MANJINGO_BASE_URL: ${{ vars.MANJINGO_BASE_URL || 'https://manyingo.pages.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Detect production surface changes
        id: production_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "needs_smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA^" "$HEAD_SHA")"
          needs_smoke=false
          while IFS= read -r file; do
            case "$file" in
              public/*|functions/*|firestore.rules|firebase.json|wrangler.toml|package.json|package-lock.json|scripts/smoke_*|scripts/cleanup_smoke_user.cjs|.github/workflows/pages-production-smoke.yml|.github/workflows/firebase-content-sync.yml)
                needs_smoke=true
                break
                ;;
            esac
          done <<< "$changed_files"
          echo "needs_smoke=$needs_smoke" >> "$GITHUB_OUTPUT"
      - name: Skip unchanged production surface
        if: steps.production_scope.outputs.needs_smoke != 'true'
        run: echo "✅ No production runtime or smoke contract changed; Firestore quota untouched."
      - name: Setup Node
        if: steps.production_scope.outputs.needs_smoke == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for Pages reliability assets after main
        if: steps.production_scope.outputs.needs_smoke == 'true' && github.event_name == 'workflow_run'
        run: |
          for attempt in $(seq 1 18); do
            if curl -fsS "$MANJINGO_BASE_URL/practice-outbox.js" | grep -q 'manjingo_practice_outbox_v1' && \
               curl -fsS "$MANJINGO_BASE_URL/stage3-reading.js" | grep -q 'ManjingoStage3Reading' && \
               curl -fsS "$MANJINGO_BASE_URL/stage3-diagnostics.js" | grep -q 'ManjingoStage3Diagnostics' && \
               curl -fsS "$MANJINGO_BASE_URL/stage3-diagnostics.js" | grep -q 'stage3-choice-diagnostics-v1' && \
               curl -fsS "$MANJINGO_BASE_URL/stage3-calibration.js" | grep -q 'ManjingoStage3Calibration' && \
               curl -fsS "$MANJINGO_BASE_URL/theme-runtime.js" | grep -q 'stage3-diagnostics.js' && \
               curl -fsS "$MANJINGO_BASE_URL/question-pack-transfer-07.js" | grep -q 'tr10q036' && \
               curl -fsS "$MANJINGO_BASE_URL/question-pack-settext-language-01.js" | grep -q 'stl1q036' && \
               curl -fsS "$MANJINGO_BASE_URL/question-pack-settext-language-02.js" | grep -q 'stl2q024' && \
               curl -fsS "$MANJINGO_BASE_URL/content-catalog.js" | grep -q 'question-pack-settext-language-02.js' && \
               curl -fsS "$MANJINGO_BASE_URL/home-shell.js" | grep -q 'stage3-reading.js'; then
              echo "Pages reliability, Stage 3 diagnostics/calibration, and prescribed-text language assets are available."
              exit 0
            fi
            echo "Waiting for Pages deployment ($attempt/18)..."
            sleep 10
          done
          echo "::error::Pages did not expose the required reliability, Stage 3 diagnostics/calibration, and prescribed-text language assets within 3 minutes."
          exit 1
      - name: Install Firebase Admin cleanup runtime
        if: steps.production_scope.outputs.needs_smoke == 'true'
        run: npm install --prefix functions --no-audit --no-fund
      - name: Require cleanup credential before creating a smoke user
        if: steps.production_scope.outputs.needs_smoke == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANJINGO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_MANJINGO cleanup credential."
            exit 1
          fi
      - name: Smoke test deployed Stage 3 learning path UI
        if: steps.production_scope.outputs.needs_smoke == 'true'
        run: npm run smoke:stage3
      - name: Smoke test production Pages learning API with a real write
        if: steps.production_scope.outputs.needs_smoke == 'true'
        run: npm run smoke:pages
      - name: Cleanup temporary smoke user and learning data
        if: always() && steps.production_scope.outputs.needs_smoke == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANJINGO }}
        run: node scripts/cleanup_smoke_user.cjs
