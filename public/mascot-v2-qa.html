<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小墨靈 v2｜答題與完成畫面驗收</title><link rel="stylesheet" href="./app-ui.css"><style>
body{padding:24px;font-family:system-ui,sans-serif;background:#f5f6f4}.qa{max-width:1100px;margin:auto}.qa header{margin-bottom:24px}.qa header img{width:min(100%,340px)}.qa-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px}.qa-panel{padding:16px;background:white;border:1px solid #e2e6df;border-radius:20px;min-width:0}.qa h1{font-size:22px}.qa h2{font-size:16px;margin:0 0 16px}.qa p{line-height:1.6}.qa-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:24px}.qa-gallery figure{margin:0;padding:12px;background:#fff;border:1px solid #e2e6df;border-radius:12px}.qa-gallery img{width:96px;height:96px;object-fit:contain}.qa-gallery figcaption{font-size:13px}.qa-note{color:#657064;font-size:13px}@media(max-width:430px){body{padding:12px}.qa-panel{padding:12px}}
</style></head><body><main class="qa"><header><img src="./brand/manyingo-logo-ink.webp" alt="Manyingo"><h1>小墨靈 v2：角色與學習回饋</h1><p class="qa-note">使用正式共用樣式、回饋模組及完成摘要。檢查 320／768／1024／1440 寬度；角色為裝飾，正誤及學習結果仍由文字交代。</p></header><div class="qa-grid"><section class="qa-panel"><h2>答對一道題</h2><div id="qaCorrect"><div class="question" hidden>測試語句</div><div class="feedback correct" id="qaCorrectFeedback">答對了！本題獲得：8 XP</div></div></section><section class="qa-panel"><h2>答錯一道題</h2><div id="qaWrong"><div class="question" hidden>測試語句</div><div class="feedback wrong" id="qaWrongFeedback">正確答案：代詞 本題獲得：0 XP</div></div></section><section class="qa-panel"><h2>一般完成（包含錯題）</h2><div id="qaComplete"></div></section><section class="qa-panel"><h2>全對完成</h2><div id="qaPerfect"></div></section></div><section class="qa-gallery" id="qaGallery" aria-label="角色各狀態"></section></main><script src="./mascot-runtime.js"></script><script src="./session-summary.js"></script><script>
window.ManjingoContent={questions:[{id:'qa',kpId:'qa',q:'測試語句',a:'代詞',explanation:'這裡只示範答題回饋的排版，正式練習仍使用已審核的題庫。'}],knowledgePoints:[]};
const qaModel={page:'home',answered:10,xp:64,masteryDelta:8,resolved:[],unlockedStages:[],persistentWeakness:false};
document.getElementById('qaComplete').innerHTML=ManjingoSessionSummary.markup({...qaModel,correct:7});document.getElementById('qaPerfect').innerHTML=ManjingoSessionSummary.markup({...qaModel,correct:10,xp:80});
const qaAssets=[['一般','./mascot/v2/neutral.svg'],['答對','./mascot/v2/happy.svg'],['答錯／難過','./mascot/v2/sad.svg'],['思考','./mascot/v2/thinking.svg'],['一般完成','./mascot/v2/complete.svg'],['全對慶祝','./mascot/v2/celebrate.svg'],['開心上半身','./mascot/v2/compact.svg']];
document.getElementById('qaGallery').innerHTML=qaAssets.map(([label,path])=>'<figure><img src="'+path+'" alt="'+label+'"><figcaption>'+label+'</figcaption></figure>').join('');
</script><script src="./feedback-ui.js"></script></body></html>
