<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manyingo 文言年糕｜學習地圖</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<style>
:root{--green:#58cc02;--blue:#1cb0f6;--ink:#000437;--gray:#afafaf;--bg:#f7f7f7}*{box-sizing:border-box}body{font-family:'Noto Sans TC',system-ui,sans-serif;max-width:680px;margin:0 auto;padding:20px 16px 50px;color:#4b4b4b;background:var(--bg)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{color:var(--green);margin:0;font-size:30px}a{color:var(--blue);font-weight:800;text-decoration:none}.summary,.unit{background:#fff;border:2px solid #ddd;border-radius:20px;padding:16px;margin-bottom:16px}.summary-title{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:6px}.summary-stats{display:flex;gap:8px}.stat{flex:1;background:#f5f5f5;border-radius:12px;padding:10px;text-align:center}.stat strong{display:block;font-size:20px;color:var(--ink)}.stat span{font-size:12px;font-weight:700}.unit-title{font-size:20px;font-weight:900;color:var(--ink);margin-bottom:14px}.path{position:relative;padding:4px 4px 4px 8px}.path:before{content:'';position:absolute;left:29px;top:30px;bottom:30px;width:6px;background:#e5e5e5;border-radius:6px}.node{position:relative;display:flex;align-items:center;gap:14px;margin:12px 0;min-height:70px;padding:5px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}.node.locked{cursor:not-allowed;opacity:.62}.circle{width:48px;height:48px;flex:0 0 48px;border-radius:50%;border:3px solid var(--gray);background:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;z-index:1}.node.mastered .circle{background:var(--green);border-color:var(--ink);color:#fff}.node.familiar .circle{background:#fff2b8;border-color:#e1ad00}.node.learning .circle{background:#dff4ff;border-color:var(--blue)}.node.available .circle{background:#fff;border-color:var(--blue)}.node.locked .circle{background:#eee;color:#aaa}.node-info{flex:1}.node-name{font-weight:900;color:var(--ink)}.node-meta{font-size:12px;color:var(--gray);font-weight:700;margin-top:3px}.mastery{height:8px;background:#eee;border-radius:8px;margin-top:7px;overflow:hidden}.mastery-fill{height:100%;background:var(--green)}.empty{padding:25px;text-align:center;font-weight:800;color:var(--gray)}.legend{font-size:12px;color:var(--gray);font-weight:700;margin-top:12px}
</style></head><body>
<header><h1>🗺️ 學習地圖</h1><a href="./index.html">← 今日學習</a></header>
<div id="app"><div class="empty">正在載入你的學習地圖……</div></div>
<script type="module">
import {loadKnowledgeMap,renderKnowledgeMap} from './knowledgeMap.js';
const app=document.getElementById('app');
try{const groups=await loadKnowledgeMap();const flat=groups.flatMap(g=>g.items);if(!flat.length){app.innerHTML='<div class="summary"><div class="summary-title">學習地圖</div><div class="empty">目前尚未建立 knowledgePoints 資料。</div></div>';}else{renderKnowledgeMap(app,groups,kpId=>{window.location.href=`./lesson.html?kpId=${encodeURIComponent(kpId)}`});}}catch(e){console.error(e);app.innerHTML='<div class="summary"><div class="empty">學習地圖暫時無法載入，請稍後再試。</div></div>'}
</script></body></html>
